name: Nexting Devices CI

on:
  pull_request:
    paths:
      - "devices/**"
      - "Package.swift"
      - ".github/workflows/nexting-devices-ci.yml"
  push:
    paths:
      - "devices/**"
      - "Package.swift"
      - ".github/workflows/nexting-devices-ci.yml"

permissions:
  contents: read

jobs:
  javascript-and-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
        working-directory: devices

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: >-
          swiftc -warnings-as-errors -o /tmp/nexting-device-sim
          main.swift ../../sdk/swift/Sources/NextingDeviceKit/Protocol.swift
        working-directory: devices/examples/macos-device-simulator

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test
        working-directory: devices/sdk/kotlin

  c99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S devices/sdk/c -B build -DNEXTING_DEVICE_SANITIZE=ON
      - run: cmake --build build && ctest --test-dir build --output-on-failure
